<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9a24a">
<title>Happy Birthday — A Little Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Space+Mono:wght@400;700&family=Bungee&family=Londrina+Solid:wght@400;900&family=Fredoka:wght@500;700&family=Titan+One&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     EDIT ME — customize the card here
     ========================================================= */
  :root{
    --name: "friend";
    --pin-top: 226px;
  }

  *{ box-sizing: border-box; }
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  html,body{
    margin:0; padding:0; min-height:100%;
    min-height:100dvh;
    background:#c9a24a;
    font-family:'Patrick Hand', cursive;
    color:#3b2a1a;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- board ---------- */
  #board{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.15), transparent 45%),
      linear-gradient(135deg, #d8b565, #c9a24a 55%, #b98f3d);
  }

  .stage{
    position:relative;
    width:100%;
    max-width:980px;
  }

  .page{
    display:none;
  }
  .page.active{ display:block; }

  /* ---------- shared bits ---------- */
  .star{
    position:absolute;
    width:26px; height:26px;
    background:#8b1e2b;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,.25));
  }

  .tag{
    display:inline-block;
    background:#fbf6e9;
    color:#3b2a1a;
    border:1px solid #d8cba3;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:6px 12px;
    box-shadow:2px 3px 0 rgba(0,0,0,.12);
    transform: rotate(-2deg);
  }

  .cutout-letter{
    display:inline-block;
    padding:0 2px;
    text-shadow:0 1px 0 rgba(0,0,0,.15);
  }

  /* ================= COVER PAGE ================= */
  .cover{
    position:relative;
    background:#e9d8a6;
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    padding:56px 40px 40px;
    min-height: min(56vh, 560px);
    overflow:hidden;
  }
  .cover .star.s1{ top:36px; left:34px; }
  .cover .star.s2{ bottom:70px; left:56px; transform:scale(.8) rotate(12deg); }
  .cover .star.s3{ top:70px; right:60px; transform:scale(.6) rotate(-10deg); opacity:.85;}

  .cover-title{
    font-size: clamp(40px, 7vw, 72px);
    line-height:1;
    margin:0 0 18px 0;
    text-align:left;
  }

  .cover-grid{
    display:flex;
    gap:32px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .tagline{
    flex:1 1 260px;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(28px, 4vw, 40px);
    line-height:1.15;
    padding-top:18px;
    color:#3b2a1a;
    min-width:220px;
  }
  .tagline .sparkle{ color:#d9a441; }

  .polaroid{
    flex:0 0 260px;
    background:#fff8ec;
    padding:14px 14px 46px;
    box-shadow:4px 6px 0 rgba(0,0,0,.18);
    transform: rotate(3deg);
    position:relative;
  }
  .polaroid .photo{
    width:100%;
    aspect-ratio: 4/5;
    background:#e3785a;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .polaroid .photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: center 20%;
    display:block;
  }
  .polaroid .name-strip{
    position:absolute;
    top:8px; left:8px;
    display:flex;
    gap:1px;
  }
  .polaroid .caption{
    position:absolute;
    bottom:10px; left:50%;
    transform: translateX(-50%) rotate(-2deg);
  }

  .open-btn{
    margin-top:34px;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:#8b1e2b;
    color:#fbf6e9;
    border:none;
    padding: clamp(10px, 3vw, 14px) clamp(16px, 6vw, 26px);
    min-height:48px;
    cursor:pointer;
    box-shadow:3px 4px 0 rgba(0,0,0,.25);
    transition: transform .15s ease;
    touch-action:manipulation;
  }
  .open-btn:hover{ transform: translate(-1px,-2px); }
  .open-btn:active{ transform: translate(1px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.25); }

  /* ================= SPREAD PAGE ================= */
  .spread{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
  }

  .panel{
    position:relative;
    background:#e9d8a6;
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    min-height: min(52vh, 520px);
    overflow:hidden;
  }

  /* envelope panel */
  .envelope-panel{
    background:
      linear-gradient(#e9d8a6 0 100%),
      repeating-linear-gradient(0deg, #c1272d 0 18px, #f2e6c9 18px 36px);
    background-blend-mode: normal;
    padding:26px;
  }
  .envelope-panel .gingham-corner{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(193,39,45,.55) 0 14px, transparent 14px 28px),
      repeating-linear-gradient(90deg, rgba(193,39,45,.55) 0 14px, transparent 14px 28px);
    -webkit-mask-image: radial-gradient(circle at 100% 0%, black 0 46%, transparent 47%);
    mask-image: radial-gradient(circle at 100% 0%, black 0 46%, transparent 47%);
    pointer-events:none;
  }
  .envelope-panel .star{ top:26px; left:26px; }
  .envelope-panel .star.s2{ top:56px; left:56px; transform:scale(.7) rotate(10deg); }

  .envelope-wrap{
    position:relative;
    margin-top:60px;
    height: min(52vw, 340px);
    overflow:hidden;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .envelope-wrap.open{ overflow:visible; }

  .letter{
    position:absolute;
    top:118px;
    left:50%;
    width:82%;
    max-width:320px;
    height: 180px;
    background:#fdfaf0;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    padding:16px 18px;
    font-size:14.5px;
    line-height:1.5;
    overflow-y:auto;
    transition: transform .6s cubic-bezier(.2,.9,.25,1), opacity .35s ease, visibility 0s linear .35s, z-index 0s .3s;
    transform: translateX(-50%) translateY(48px);
    z-index:1;
    opacity:0;
    visibility:hidden;
  }
  .letter::-webkit-scrollbar{ width:6px; }
  .letter::-webkit-scrollbar-thumb{ background:#d8cba3; border-radius:3px; }
  .letter p{ margin:0 0 10px 0; }
  .letter .sign{ margin-top:14px; }

  .envelope-body{
    position:absolute;
    bottom:0;
    left:50%;
    width:88%;
    max-width:340px;
    height: min(38vw, 220px);
    background:#b5222a;
    box-shadow:0 8px 18px rgba(0,0,0,.3);
    transform: translateX(-50%);
    z-index:2;
  }
  .envelope-flap{
    position:absolute;
    bottom:0; left:50%;
    width:88%;
    max-width:340px;
    height: min(38vw, 220px);
    background:#c1272d;
    clip-path: polygon(0 0, 100% 0, 50% 62%);
    transform-origin: top center;
    transform: translateX(-50%);
    transition: transform .5s ease;
    z-index:4;
    box-shadow: inset 0 -2px 6px rgba(0,0,0,.15);
  }
  .pin{
    position:absolute;
    top:210px; left:50%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a8a, #c1272d 60%, #7a1414);
    box-shadow:0 2px 3px rgba(0,0,0,.4);
    z-index:5;
  }

  .envelope-wrap.open .letter{
    /* expand letter to cover the viewport like a modal */
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(0);
    width: min(92%, 720px);
    height: min(85dvh, 720px);
    max-height: 85dvh;
    z-index:60;
    border-radius:8px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transition: all .45s cubic-bezier(.2,.9,.25,1), opacity .35s ease, visibility 0s linear;
    overflow:auto;
    -webkit-overflow-scrolling: touch;
    opacity:1;
    visibility:visible;
  }
  .envelope-wrap.open .envelope-flap{
    transform: translateX(-50%) rotateX(180deg);
    z-index:1;
  }
  .envelope-wrap.open .envelope-body,
  .envelope-wrap.open .pin{
    opacity:0; pointer-events:none; transition: opacity .3s ease;
  }

  .hint{
    text-align:center;
    margin-top:18px;
  }

  /* cake panel */
  .cake-panel{
    background: linear-gradient(#7b1e1e, #5c1414 70%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 20px 30px;
    color:#fbf6e9;
  }
  .cake-panel .torn{
    position:absolute; left:0; right:0; top:96px; height:16px;
    background:#7b1e1e;
    clip-path: polygon(0% 100%, 3% 30%, 7% 90%, 11% 20%, 15% 80%, 19% 10%, 23% 70%, 27% 15%, 31% 85%, 35% 25%, 39% 75%, 43% 15%, 47% 90%, 51% 30%, 55% 80%, 59% 10%, 63% 70%, 67% 20%, 71% 85%, 75% 15%, 79% 75%, 83% 25%, 87% 90%, 91% 20%, 95% 80%, 100% 30%, 100% 100%);
  }

  .cake-title{
    font-size: clamp(30px, 5vw, 46px);
    line-height:1.05;
    text-align:center;
    margin:26px 0 8px;
  }

  .cake-wrap{
    position:relative;
    margin-top:20px;
    width: min(100%, 260px);
  }

  .candles{
    display:flex;
    justify-content:center;
    gap:20px;
    position:relative;
    z-index:2;
    margin-bottom:-10px;
  }
  .candle{
    width:14px;
    height:46px;
    background: repeating-linear-gradient(180deg, #f4dfc0 0 6px, #e8c98f 6px 12px);
    border-radius:2px;
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action:manipulation;
  }
  .candle::before{
    content:'';
    position:absolute;
    inset:-18px -14px;
  }
  .flame{
    position:absolute;
    top:-20px; left:50%;
    transform:translateX(-50%);
    width:12px; height:20px;
    background: radial-gradient(circle at 50% 70%, #ffe08a, #ff9d3d 55%, #e8592a 90%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 1.1s ease-in-out infinite;
    transition: opacity .2s ease, transform .2s ease;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(0deg); }
    50%{ transform:translateX(-50%) scale(1.08,.94) rotate(3deg); }
  }
  .candle.out .flame{ opacity:0; transform:translateX(-50%) scale(0); }
  .smoke{
    position:absolute;
    top:-22px; left:50%;
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(230,230,230,.8);
    opacity:0;
    pointer-events:none;
  }
  .candle.out .smoke{
    animation: rise 1s ease-out forwards;
  }
  @keyframes rise{
    0%{ opacity:.85; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-34px) scale(3.2); }
  }

  .cake-svg{ display:block; width:100%; }

  .blow-tag{ margin-top:16px; }

  .cake-status{
    font-family:'Space Mono', monospace;
    font-size:12px;
    margin-top:14px;
    opacity:.85;
    text-align:center;
    min-height:16px;
  }

  .for-tag-wrap{
    display:flex;
    justify-content:center;
    margin-top:22px;
  }

  /* ---------- wish overlay ---------- */
  .wish-overlay{
    position:fixed; inset:0;
    background:rgba(20,10,6,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .wish-overlay.show{ display:flex; }
  .wish-card{
    background:#fbf6e9;
    max-width:420px;
    width:100%;
    padding:34px 28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    position:relative;
  }
  .wish-card h3{
    font-family:'Caveat', cursive;
    font-size:36px;
    margin:0 0 8px;
    color:#7b1e1e;
  }
  .wish-card p{ font-size:16px; line-height:1.5; }
  .wish-close{
    margin-top:10px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    background:#8b1e2b;
    color:#fbf6e9;
    border:none;
    padding:12px 22px;
    min-height:44px;
    cursor:pointer;
    touch-action:manipulation;
  }

  .confetti-piece{
    position:fixed;
    top:-10px;
    width:8px; height:14px;
    z-index:51;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(540deg); opacity:.9; }
  }

  .back-btn{
    display:block;
    margin:18px auto 0;
    background:none;
    border:none;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:#fff8ec;
    opacity:.8;
    cursor:pointer;
    text-decoration:underline;
    padding:12px 16px;
    min-height:44px;
    touch-action:manipulation;
  }

  /* ---------- mobile & tablet ---------- */
  @media (max-width: 720px){
    :root{
      --pin-top: 158px;
    }

    #board{
      align-items:flex-start;
      padding-top:max(12px, env(safe-area-inset-top));
      padding-bottom:max(20px, env(safe-area-inset-bottom));
    }

    .cover{
      padding:36px 20px 28px;
      min-height:auto;
    }
    .cover .star.s1{ top:18px; left:16px; transform:scale(.85); }
    .cover .star.s2{ bottom:40px; left:20px; }
    .cover .star.s3{ top:24px; right:18px; }

    .cover-title{
      font-size:clamp(32px, 11vw, 56px);
      text-align:center;
      margin-bottom:14px;
    }

    .cover-grid{
      flex-direction:column;
      align-items:center;
      gap:20px;
    }

    .tagline{
      flex:none;
      width:100%;
      min-width:0;
      text-align:center;
      padding-top:0;
      font-size:clamp(26px, 7vw, 36px);
    }

    .polaroid{
      flex:none;
      width:min(100%, 240px);
      margin:0 auto;
      transform:rotate(2deg);
    }

    .open-btn{
      display:block;
      width:100%;
      margin-top:24px;
      text-align:center;
    }

    .spread{
      grid-template-columns:1fr;
      gap:12px;
    }

    .panel{
      min-height:auto;
    }

    .envelope-panel{
      padding:18px 14px 20px;
    }

    .envelope-wrap{
      margin-top:28px;
      height:min(52vw, 280px);
      min-height:220px;
    }

    .letter{
      top:100px;
      width:90%;
      max-width:none;
      height:150px;
      min-height:150px;
      max-height:min(60vh, 360px);
      font-size:14px;
      padding:14px 12px;
      transform:translateX(-50%) translateY(34px);
      -webkit-overflow-scrolling:touch;
    }

    .envelope-body,
    .envelope-flap{
      width:92%;
      top:18px;
      max-width:none;
      height:min(38vw, 176px);
      min-height:132px;
    }

    .envelope-flap{
      /* top:92px; */
    }

    .pin{
      top:172px;
    }

    .envelope-wrap.open .letter{
      transform:translateX(-50%) translateY(-18px);
    }

    .hint{
      margin-top:12px;
    }
    .hint .tag{
      font-size:11px;
      padding:5px 10px;
    }

    .cake-panel{
      padding:20px 16px 24px;
    }

    .cake-title{
      margin:12px 0 4px;
      font-size:clamp(26px, 8vw, 40px);
    }

    .cake-wrap{
      width:min(100%, 240px);
      margin-top:12px;
    }

    .candles{
      gap:16px;
    }

    .cake-status{
      font-size:11px;
      padding:0 8px;
      line-height:1.4;
    }

    .wish-overlay{
      padding:16px;
      padding-bottom:max(16px, env(safe-area-inset-bottom));
      align-items:flex-end;
    }

    .wish-card{
      max-height:85dvh;
      overflow-y:auto;
      padding:28px 20px;
      -webkit-overflow-scrolling:touch;
    }

    .wish-card h3{
      font-size:clamp(28px, 8vw, 36px);
    }

    .wish-card p{
      font-size:15px;
    }
  }

  @media (max-width: 380px){
    .cover{
      padding:28px 14px 22px;
    }

    .cover-title{
      font-size:clamp(28px, 10vw, 44px);
    }

    .polaroid{
      width:100%;
      padding:10px 10px 38px;
    }

    .envelope-wrap{
      margin-top:20px;
      min-height:200px;
    }

    .letter{
      font-size:13px;
      padding:14px 12px;
    }

    .cake-wrap{
      width:100%;
    }

    .candles{
      gap:12px;
    }
  }

  @media (hover: none) and (pointer: coarse){
    .open-btn:hover,
    .back-btn:hover{
      transform:none;
    }
  }
</style>
</head>
<body>

<div id="board">
  <div class="stage">

    <!-- ================= COVER ================= -->
    <section class="page active" id="page-cover">
      <div class="cover">
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>

        <h1 class="cover-title" id="cover-title"></h1>

        <div class="cover-grid">
          <div class="tagline"><span class="sparkle">✨</span>Krischala aka clumsy<span class="sparkle">✨</span>
          </div>

            <div class="caption"><span class="tag" id="poloroid-caption">for you ♥</span></div>
          </div>
        </div>

        <button class="open-btn" id="open-card-btn">open your card</button>
      </div>
    </section>

    <!-- ================= SPREAD ================= -->
    <section class="page" id="page-spread">
      <div class="spread">

        <!-- Envelope -->
        <div class="panel envelope-panel">
          <div class="gingham-corner"></div>
          <div class="star"></div>
          <div class="star s2"></div>

          <div class="envelope-wrap" id="envelope">
            <div class="letter" id="letter-content"></div>
            <div class="envelope-body"></div>
            <div class="envelope-flap"></div>
            <div class="pin"></div>
          </div>

          <div class="hint"><span class="tag">click letter to open and close</span></div>
        </div>

        <!-- Cake -->
        <div class="panel cake-panel">
          <h2 class="cake-title" id="cake-title"></h2>

          <div class="cake-wrap">
            <div class="candles" id="candles">
              <div class="candle" data-i="0"><div class="flame"></div><div class="smoke"></div></div>
              <div class="candle" data-i="1"><div class="flame"></div><div class="smoke"></div></div>
              <div class="candle" data-i="2"><div class="flame"></div><div class="smoke"></div></div>
            </div>
            <svg class="cake-svg" viewBox="0 0 260 130" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="130" cy="118" rx="118" ry="10" fill="#4a0f0f" opacity="0.4"/>
              <rect x="18" y="46" width="224" height="66" rx="14" fill="#fbf1e6"/>
              <path d="M18 60 Q40 44 62 60 T106 60 T150 60 T194 60 T238 60 L238 76 Q216 92 194 76 T150 76 T106 76 T62 76 T18 76 Z" fill="#f6dfe6" opacity="0.9"/>
              <path d="M14 46 Q40 20 66 46 Q92 20 118 46 Q144 20 170 46 Q196 20 222 46 Q236 20 246 46 L246 62 L14 62 Z" fill="#c1272d"/>
            </svg>
          </div>

          <div class="blow-tag"><span class="tag" id="blow-tag-text">blow the candles</span></div>
          <div class="cake-status" id="cake-status"></div>

          <div class="for-tag-wrap"><span class="tag" id="for-tag"></span></div>
        </div>
      </div>

      <button class="back-btn" id="back-btn">← back to cover</button>
    </section>

  </div>
</div>

<!-- wish overlay -->
<div class="wish-overlay" id="wish-overlay">
  <div class="wish-card">
    <h3 id="wish-title">make a wish 🎂</h3>
    <p id="wish-body"></p>
    <button class="wish-close" id="wish-close">close</button>
  </div>
</div>

<script>
/* =========================================================
   EDIT ME — all customizable content lives here
   ========================================================= */
const CARD = {
  name: "Krishala aka clumsy",        // shows big on the cover
  captionTag: "for you ♥",            // little tag under the polaroid
  forTag: "for you ♥",                // little tag under the cake
  cakeTitleLines: ["blow", "the", "candles"],
  letterParagraphs: [
    "Dear Krishala,",
    "You may not be my sister by blood, but somewhere along the way, you became my little sister by heart. I didn&rsquo;t have to be born with you in my life to feel this bond with you. I chose you as my sister, and honestly, I&rsquo;m so grateful that I did. Having you in my life has brought me a kind of happiness and warmth that is difficult to put into words. The laughs, the silly moments, the teasing, the little arguments, and all the memories we&rsquo;ve made have become some of the things I cherish the most.",
    "I may not always know the perfect way to show it, but I genuinely care about you and want nothing but the best for you. I want to see you happy, confident, successful, and surrounded by people who truly value you. And no matter how much life changes, I hope you always remember that you have an elder brother who chose you, believes in you, and will always be there whenever you need someone.",
    "On your birthday, I just want to say how lucky I feel to have found a sister in you. Some relationships are given to us by blood, while some are created by the heart&mdash;and I&rsquo;m grateful that ours is one of those. ❤️ Happy Birthday to my little sister, my chosen family, and someone who has become a very special part of my life. I hope this year brings you endless happiness, beautiful memories, and everything your heart wishes for. Always keep smiling, little one. You deserve the very best. 🎂❤️"
  ],
  wishBody: "Whatever you wished for — I hope it finds its way to you this year. Happy birthday! 🎂"
};

/* ---------- build cover title as cutout letters ---------- */
const cutoutColors = ['#e94f64','#5b8fd9','#f2c94c','#6fcf97','#bb6bd9','#f2994a'];
const cutoutFonts  = ["'Bungee'", "'Londrina Solid'", "'Fredoka'", "'Titan One'"];

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function cutoutHTML(text){
  return [...text].map((ch)=>{
    if(ch === ' ') return '<span style="display:inline-block;width:0.35em;"></span>';
    const rot = (Math.random()*16 - 8).toFixed(1);
    const color = rand(cutoutColors);
    const font = rand(cutoutFonts);
    return `<span class="cutout-letter" style="transform:rotate(${rot}deg); color:${color}; font-family:${font};">${ch}</span>`;
  }).join('');
}

document.getElementById('cover-title').innerHTML = cutoutHTML(CARD.name);
document.getElementById('cake-title').innerHTML = CARD.cakeTitleLines.map(cutoutHTML).join('<br>');
document.getElementById('poloroid-caption').textContent = CARD.captionTag;
document.getElementById('for-tag').textContent = CARD.forTag;
document.getElementById('letter-content').innerHTML =
  CARD.letterParagraphs.map(p => `<p>${p}</p>`).join('');
document.getElementById('wish-body').textContent = CARD.wishBody;

/* ---------- navigation ---------- */
const pageCover = document.getElementById('page-cover');
const pageSpread = document.getElementById('page-spread');

document.getElementById('open-card-btn').addEventListener('click', () => {
  pageCover.classList.remove('active');
  pageSpread.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('back-btn').addEventListener('click', () => {
  pageSpread.classList.remove('active');
  pageCover.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- envelope open/close ---------- */
const envelope = document.getElementById('envelope');
envelope.addEventListener('click', () => {
  envelope.classList.toggle('open');
});

/* ---------- candles ---------- */
const candles = [...document.querySelectorAll('.candle')];
const statusEl = document.getElementById('cake-status');
const blowTagText = document.getElementById('blow-tag-text');
let blownCount = 0;

function updateStatus(){
  if(blownCount === 0){
    statusEl.textContent = 'tap each candle to blow it out';
  } else if(blownCount < candles.length){
    statusEl.textContent = `${blownCount} of ${candles.length} out — keep going`;
  } else {
    statusEl.textContent = 'all out — make a wish!';
  }
}
updateStatus();

candles.forEach(c => {
  c.addEventListener('click', () => {
    if(c.classList.contains('out')) return;
    c.classList.add('out');
    blownCount++;
    updateStatus();
    if(blownCount === candles.length){
      blowTagText.textContent = 'happy birthday!';
      setTimeout(showWish, 500);
    }
  });
});

/* ---------- wish overlay + confetti ---------- */
const wishOverlay = document.getElementById('wish-overlay');
document.getElementById('wish-close').addEventListener('click', () => {
  wishOverlay.classList.remove('show');
});

function showWish(){
  wishOverlay.classList.add('show');
  spawnConfetti();
}

function spawnConfetti(){
  const colors = ['#e94f64','#5b8fd9','#f2c94c','#6fcf97','#bb6bd9','#f2994a'];
  for(let i=0;i<60;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = rand(colors);
    piece.style.animationDuration = (2 + Math.random()*1.5) + 's';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 3600);
  }
}
</script>
</body>
</html>
